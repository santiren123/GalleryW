<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>行记 — Album</title>
<meta name="description" content="A photographic album from 行记 — A Travelogue in Light.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="stylesheet" href="css/style.css?v=27">
</head>
<body data-theme="light" class="album-body">

<div class="grain" aria-hidden="true"></div>

<div class="page-transition is-covering" id="pageTransition" aria-hidden="true"></div>

<!-- ======================= CURSOR ======================= -->
<div class="cursor" id="cursor" aria-hidden="true">
  <div class="cursor-dot"></div>
  <div class="cursor-ring"><span class="cursor-label"></span></div>
</div>

<!-- ======================= PROGRESS ======================= -->
<div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

<!-- ======================= HEADER ======================= -->
<div class="site-head-blur" aria-hidden="true"></div>
<header class="site-head">
  <a class="brand" href="index.html">
    <span class="brand-cn" lang="zh">WPHOT</span>
    <span class="brand-en">a travelogue<br>By William</span>
  </a>
</header>

<main class="album-page">
  <header class="album-head">
    <span class="chapter-no" id="albumNo">album</span>
    <span class="chapter-cn" lang="zh" id="albumCn"></span>
    <h1 class="chapter-title" id="albumTitle"></h1>
    <p class="chapter-sub" id="albumSub"></p>
    <span class="album-count" id="albumCount"></span>
  </header>

  <div class="album-grid" id="albumGrid"></div>

  <footer class="album-foot">
    <span class="album-foot-note" lang="zh">卷终 — end of album</span>
    <a class="album-next" id="nextLink" href="#" data-cursor="view"></a>
    <a class="album-home" href="index.html">↑ back to the journey</a>
  </footer>
</main>

<!-- ======================= LIGHTBOX ======================= -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightbox-veil" id="lightboxVeil"></div>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <figcaption class="lightbox-cap" id="lightboxCap"></figcaption>
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
</div>

<script src="libs/gsap.min.js"></script>
<script src="libs/ScrollTrigger.min.js"></script>
<script src="libs/lenis.min.js"></script>
<script src="js/albums.js?v=5"></script>
<script src="js/album.js?v=5"></script>
<script src="js/transition.js?v=3"></script>
<script src="js/focus.js?v=2"></script>
<script src="js/sound.js?v=7"></script>
</body>
</html>
